function addPose(pose){
  const mq=model.quaternion.clone();
  for(const [n,rots] of Object.entries(pose.bones||{})){
    const b=bones[n];if(!b)continue;let d=new THREE.Quaternion();
    for(const [ax,ang] of rots){d.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(...ax).normalize(),ang));}
    const dW=mq.clone().multiply(d).multiply(mq.clone().invert());const rw=restWorld[n];
    b.quaternion.multiply(rw.clone().invert().multiply(dW).multiply(rw));
  }
}

function makeProps(){
  const red=new THREE.MeshToonMaterial({color:0xff1a3a,gradientMap:gm,emissive:0x550010});
  const dark=new THREE.MeshToonMaterial({color:0x222226,gradientMap:gm});
  const steel=new THREE.MeshToonMaterial({color:0x9a9aa6,gradientMap:gm});
  const mk=(geo,mat)=>new THREE.Mesh(geo,mat);
  // dumbbell
  const db=new THREE.Group();const bar=mk(new THREE.CylinderGeometry(0.012,0.012,0.16,16),steel);bar.rotation.z=Math.PI/2;db.add(bar);
  for(const s of [-1,1]){const p=mk(new THREE.CylinderGeometry(0.045,0.045,0.04,6),dark);p.rotation.z=Math.PI/2;p.position.x=s*0.07;db.add(p);
    const r=mk(new THREE.TorusGeometry(0.045,0.005,8,6),red);r.userData.glow=true;r.rotation.y=Math.PI/2;r.position.x=s*0.07;db.add(r);}
  props.dumbbell=db;
  // barbell
  const bb=new THREE.Group();const b2=mk(new THREE.CylinderGeometry(0.01,0.01,1.2,16),steel);b2.rotation.z=Math.PI/2;bb.add(b2);
  for(const s of [-1,1])for(const k of [0,1]){const p=mk(new THREE.CylinderGeometry(0.11-k*0.025,0.11-k*0.025,0.03,24),k?red:dark);p.rotation.z=Math.PI/2;p.position.x=s*(0.45+k*0.035);bb.add(p);}
  props.barbell=bb;
  // band
  const band=mk(new THREE.TorusGeometry(0.12,0.012,10,48),red);props.band=band;
  // stairs
  const st=new THREE.Group();for(let i=0;i<8;i++){const s=mk(new THREE.BoxGeometry(0.8,0.1,0.25),dark);s.position.set(0,0.05+i*0.1,-i*0.25);st.add(s);
    const e=mk(new THREE.BoxGeometry(0.82,0.008,0.008),new THREE.MeshBasicMaterial({color:0xff2040}));e.userData.glow=true;e.position.set(0,0.1+i*0.1,-i*0.25+0.125);st.add(e);}
  props.stairs=st;
  // gym machine (simple station)
  const gymG=new THREE.Group();const fm=dark;
  for(const x of [-0.4,0.4]){const p=mk(new THREE.BoxGeometry(0.05,1.4,0.05),fm);p.position.set(x,0.7,0);gymG.add(p);}
  const top=mk(new THREE.BoxGeometry(0.85,0.05,0.05),fm);top.position.y=1.4;gymG.add(top);
  const stack=mk(new THREE.BoxGeometry(0.3,0.5,0.15),red);stack.position.y=0.3;gymG.add(stack);
  props.gym=gymG;
  for(const k in props){props[k].visible=false;scene.add(props[k]);}
}

const bloomComposer=new EffectComposer(renderer);bloomComposer.renderToScreen=false;
bloomComposer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(W/2,H/2),1.0,0.35,0.0);bloomComposer.addPass(bloom);
const mixPass=new ShaderPass(new THREE.ShaderMaterial({uniforms:{baseTexture:{value:null},bloomTexture:{value:bloomComposer.renderTarget2.texture}},
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
 fragmentShader:'uniform sampler2D baseTexture;uniform sampler2D bloomTexture;varying vec2 vUv;void main(){gl_FragColor=texture2D(baseTexture,vUv)+vec4(1.0)*texture2D(bloomTexture,vUv);}'}),'baseTexture');
mixPass.needsSwap=true;
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));composer.addPass(mixPass);composer.addPass(new OutputPass());
const blackMat=new THREE.MeshBasicMaterial({color:0x000000});
function renderAll(){
  // bloom pass: only emissive things
  uBloomOnly.value=1;const bg=scene.background;scene.background=new THREE.Color(0);
  const saved=[];scene.traverse(o=>{if(o.isMesh&&o.userData.glow!==true&&o.userData.glowSkin!==true){saved.push([o,o.material]);o.material=blackMat;}});
  const fogSave=scene.fog;scene.fog=null;grid.visible=false;parts.visible=false;
  bloomComposer.render();
  for(const [o,m] of saved)o.material=m;grid.visible=true;parts.visible=true;scene.background=bg;scene.fog=fogSave;uBloomOnly.value=0;
  composer.render();
}
window.grab=()=>document.getElementById('c').toDataURL('image/jpeg',0.93);
window.frame=(st)=>{
  uTime.value=st.t||0;uOW.value=st.outline??0.0016;uDebug.value=st.debug||0;
  for(const m of MUSCLES)uM['m_'+m].value=(st.muscles&&st.muscles[m])||0;
  charRoot.visible=st.char!==false;
  charRoot.position.set(...(st.charPos||[0,0,0]));
  charRoot.rotation.y=st.charRotY||0;
  const sc=st.charScale||1.75;charRoot.scale.setScalar(sc);
  if(st.anim){applyPose({});retarget(st);
    if(st.anim2&&st.mix>0){const qa={},ra=bones[T.root].position.clone();for(const n in bones)qa[n]=bones[n].quaternion.clone();
      applyPose({});retarget({anim:st.anim2});const k=st.mix;
      for(const n in bones)bones[n].quaternion.copy(qa[n].clone().slerp(bones[n].quaternion,k));
      bones[T.root].position.copy(ra.lerp(bones[T.root].position,k));}
    if(st.pose)addPose(st.pose);} else applyPose(st.pose||{});
  disc.position.x=charRoot.position.x;disc.position.z=charRoot.position.z;disc.scale.setScalar(st.discScale||1);
  for(const k in props){const p=st.props&&st.props[k];props[k].visible=!!p;if(p){props[k].position.set(...p.pos);props[k].rotation.set(...(p.rot||[0,0,0]));props[k].scale.setScalar(p.s||1);}}
  // attach props to hands if requested
  if(st.handProp){const {name,bone,offset}=st.handProp;const p=props[name];p.visible=true;
    model.updateMatrixWorld(true);const v=new THREE.Vector3(...(offset||[0,0,0]));bones[bone].localToWorld(v);p.position.copy(v);}
  const c=st.cam||{pos:[0,1.0,5.2],target:[0,0.9,0],fov:30};
  camera.position.set(...c.pos);camera.fov=c.fov||30;camera.updateProjectionMatrix();camera.lookAt(...c.target);
  parts.position.y=-(((st.t||0)*0.15)%1)*0.0;
  const a=pg.attributes.position.array;for(let i=0;i<N;i++){a[i*3+1]=((pp[i*3+1]+(st.t||0)*0.25)%5);}pg.attributes.position.needsUpdate=true;
  grid.material.opacity=0.3+0.1*Math.sin((st.t||0)*2.5);
  bloom.strength=st.bloom??1.0;
  renderAll();
  const out={};
  if(st.project){model.updateMatrixWorld(true);for(const n of st.project){let v=new THREE.Vector3();
    if(bones[n])bones[n].getWorldPosition(v);else if(props[n])props[n].getWorldPosition(v);else continue;
    v.project(camera);out[n]=[(v.x+1)/2*W,(1-v.y)/2*H];}}
  return out;
};
window.dbg2=()=>window._d;
window.dbg=()=>{model.updateMatrixWorld(true);const o={};for(const k of ['tripoRoot','tripo0_Left_Limb_0','tripo0_Left_Limb_1','tripo0_Left_Limb_2','tripo0_Right_Limb_1','tripoHead_0','bone_26']){const v=new THREE.Vector3();bones[k].getWorldPosition(v);o[k]=v.toArray().map(x=>+x.toFixed(3));}return o;};
window.restDbg=()=>{const o={};for(const k in restPos)o[k]=restPos[k].toArray().map(x=>+x.toFixed(3));return o;};
window.srcDbg=(n,t)=>{const P=srcPose(n,t);const o={};for(const k of ['Hips','LeftUpLeg','RightUpLeg','LeftFoot','Head','LeftArm','RightArm'])o[k]=P[k].toArray().map(x=>+x.toFixed(2));return o;};
window.boneWorld=(n)=>{model.updateMatrixWorld(true);const v=new THREE.Vector3();bones[n].getWorldPosition(v);return v.toArray();};
window.ready=true;
</script></body></html>
